<span
  class="task-status-badge inline-flex items-center gap-1.5 px-2 py-0.5 rounded text-[10px] font-bold border shadow-2xs whitespace-nowrap transition-colors"
  [ngClass]="badgeClass()"
>
  <span class="w-1.5 h-1.5 rounded-full shrink-0" [ngClass]="dotClass()"></span>
  <span>{{ status() }}</span>
</span>
