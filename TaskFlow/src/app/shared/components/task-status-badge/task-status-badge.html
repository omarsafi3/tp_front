<span
  class="task-status-badge inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[10px] font-bold border whitespace-nowrap transition-all duration-150"
  [ngClass]="badgeClass()"
>
  <span class="w-1.5 h-1.5 rounded-full shrink-0" [ngClass]="dotClass()"></span>
  <span>{{ status() }}</span>
</span>
