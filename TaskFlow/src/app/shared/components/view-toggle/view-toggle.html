<div class="inline-flex items-center p-1 bg-slate-100/95 rounded-xl border border-slate-200/80 shadow-inner">
  <!-- Bouton Par tâche -->
  <button
    type="button"
    (click)="setView('tasks')"
    class="flex items-center gap-2 px-3.5 sm:px-4 py-2 rounded-lg text-xs sm:text-[13px] font-semibold transition-all duration-200 cursor-pointer select-none"
    [class.bg-white]="currentView() === 'tasks'"
    [class.text-slate-900]="currentView() === 'tasks'"
    [class.shadow-xs]="currentView() === 'tasks'"
    [class.ring-1]="currentView() === 'tasks'"
    [class.ring-slate-900/5]="currentView() === 'tasks'"
    [class.text-slate-500]="currentView() !== 'tasks'"
    [class.hover:text-slate-800]="currentView() !== 'tasks'"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      class="w-4 h-4 transition-colors duration-200"
      [class.text-indigo-600]="currentView() === 'tasks'"
      [class.text-slate-400]="currentView() !== 'tasks'"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
      stroke-width="2.2"
    >
      <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
    </svg>
    <span>Par tâche</span>
  </button>

  <!-- Bouton Par user -->
  <button
    type="button"
    (click)="setView('users')"
    class="flex items-center gap-2 px-3.5 sm:px-4 py-2 rounded-lg text-xs sm:text-[13px] font-semibold transition-all duration-200 cursor-pointer select-none"
    [class.bg-white]="currentView() === 'users'"
    [class.text-slate-900]="currentView() === 'users'"
    [class.shadow-xs]="currentView() === 'users'"
    [class.ring-1]="currentView() === 'users'"
    [class.ring-slate-900/5]="currentView() === 'users'"
    [class.text-slate-500]="currentView() !== 'users'"
    [class.hover:text-slate-800]="currentView() !== 'users'"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      class="w-4 h-4 transition-colors duration-200"
      [class.text-indigo-600]="currentView() === 'users'"
      [class.text-slate-400]="currentView() !== 'users'"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
      stroke-width="2.2"
    >
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
    </svg>
    <span>Par user</span>
  </button>
</div>
