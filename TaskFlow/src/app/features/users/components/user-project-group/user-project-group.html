<div class="rounded-2xl bg-slate-50/70 border border-slate-200/60 p-4 space-y-3">
  <!-- En-tête : Nom du projet et nombre de tâches -->
  <div class="flex items-center justify-between">
    <div class="flex items-center gap-2 min-w-0">
      <span class="w-2.5 h-2.5 rounded-full bg-indigo-500 shrink-0"></span>
      <h5 class="text-sm font-bold text-slate-800 truncate">
        {{ projectName() }}
      </h5>
    </div>
    <span class="text-xs font-bold px-2.5 py-0.5 rounded-lg bg-white text-indigo-600 border border-slate-200/60 shadow-xs shrink-0">
      {{ tasks().length }} {{ tasks().length > 1 ? 'tâches' : 'tâche' }}
    </span>
  </div>

  <!-- Réutilisation du composant task-list avec assigné masqué -->
  <app-task-list
    [tasks]="tasks()"
    [showAssignee]="false"
  />
</div>
