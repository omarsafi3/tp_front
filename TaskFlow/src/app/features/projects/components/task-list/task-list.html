<div class="task-list space-y-2.5">
  <!-- Partie 8.2 : @if pour afficher "Aucune tâche" -->
  @if (tasks().length === 0) {
    <div class="text-xs text-slate-400 font-medium py-3 text-center bg-slate-50/60 rounded-xl border border-dashed border-slate-200">
      Aucune tâche.
    </div>
  } @else {
    <ul class="space-y-2">
      @for (task of tasks(); track task.id) {
        <!-- Partie 9 : Tâche avec bordure latérale, espacement et fond différencié -->
        <li
          class="flex flex-col sm:flex-row sm:items-center justify-between gap-2.5 p-3 rounded-2xl border border-slate-100 shadow-[0_2px_8px_rgba(0,0,0,0.02)] transition-all duration-200 hover:shadow-sm"
          [ngClass]="getTaskStatusBorderClass(task.status)"
        >
          <!-- Partie 6.1 : Interpolation du titre de la tâche -->
          <div class="flex items-center gap-2.5 min-w-0">
            <span
              class="w-2 h-2 rounded-full shrink-0"
              [class.bg-emerald-500]="task.status === 'Terminé'"
              [class.bg-blue-500]="task.status === 'En cours'"
              [class.bg-amber-500]="task.status === 'En attente'"
            ></span>
            <span
              class="text-xs sm:text-sm font-semibold text-slate-700 truncate"
              [class.line-through]="task.status === 'Terminé'"
              [class.text-slate-400]="task.status === 'Terminé'"
            >
              {{ task.title }}
            </span>
          </div>

          <div class="flex flex-wrap items-center gap-2 shrink-0">
            <!-- Nom de l'assigné (affiché seulement si showAssignee est vrai) -->
            @if (showAssignee()) {
              <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg text-[11px] font-semibold bg-white text-slate-600 border border-slate-200/60 shadow-2xs">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-3 h-3 text-indigo-400" viewBox="0 0 20 20" fill="currentColor">
                  <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd" />
                </svg>
                {{ getAssigneeName(task.assigneeId) }}
              </span>
            }

            <!-- Partie 6.1 : Interpolation de la priorité avec badge -->
            <span
              class="inline-flex items-center px-2 py-0.5 rounded-lg text-[10px] font-bold uppercase tracking-wider border shadow-2xs"
              [ngClass]="getPriorityBadgeClass(task.priority)"
            >
              {{ task.priority }}
            </span>

            <!-- Partie 6.1 : Interpolation du statut avec badge différencié -->
            <span
              class="inline-flex items-center px-2 py-0.5 rounded-lg text-[10px] font-bold border shadow-2xs"
              [ngClass]="getStatusBadgeClass(task.status)"
            >
              {{ task.status }}
            </span>
          </div>
        </li>
      }
    </ul>
  }
</div>
