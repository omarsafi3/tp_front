<div class="task-list space-y-2.5">
  <!-- Partie 2.2 & 2.3 : @for avec track task.id et @empty pour "Aucune tâche" -->
  @for (task of tasks(); track task.id) {
    <!-- Partie 2.1, 2.2 & 2.5 : Utilisation de TaskItem avec property binding [task] et [showAssignee] -->
    <app-task-item
      [task]="task"
      [showAssignee]="showAssignee()"
      [assigneeName]="getAssigneeName(task.assigneeId)"
      (taskStatusChange)="onTaskStatusChange(task.id, $event)"
    />
  } @empty {
    <div class="text-xs text-slate-400 font-medium py-5 text-center bg-slate-50/70 rounded-xl border border-dashed border-slate-200">
      Aucune tâche
    </div>
  }
</div>
