<div class="min-h-screen bg-[#f8fafc] relative overflow-x-clip flex flex-col font-sans text-slate-900">
  <!-- Toile de fond architecturale ( Grille subtile + halos lumineux ) -->
  <div class="fixed inset-0 bg-workspace-grid pointer-events-none -z-20 [mask-image:radial-gradient(ellipse_80%_65%_at_50%_0%,#000_55%,transparent_100%)]"></div>
  <div class="fixed -top-40 left-1/2 -translate-x-1/2 w-[900px] h-[420px] rounded-full bg-gradient-to-tr from-indigo-500/12 via-violet-400/10 to-sky-400/12 blur-[120px] pointer-events-none -z-10"></div>
  <div class="fixed bottom-[-15%] right-[-8%] w-[520px] h-[520px] rounded-full bg-indigo-400/8 blur-[130px] pointer-events-none -z-10"></div>

  <!-- Liseré supérieur signature -->
  <div class="h-1 w-full bg-gradient-to-r from-indigo-600 via-violet-600 to-sky-500"></div>

  <!-- Barre de navigation supérieure (Frosted Glass Command Header) -->
  <header class="sticky top-0 z-40 bg-white/80 backdrop-blur-2xl border-b border-slate-200/75 shadow-[0_1px_2px_rgba(15,23,42,0.03),0_8px_24px_-6px_rgba(15,23,42,0.04)]">
    <div class="max-w-[86rem] mx-auto px-4 sm:px-6 lg:px-8 h-18 sm:h-20 flex items-center justify-between gap-4">
      <!-- Identité visuelle TaskFlow -->
      <div class="flex items-center gap-3.5 group cursor-pointer select-none">
        <div class="relative w-10 h-10 sm:w-11 sm:h-11 rounded-2xl bg-gradient-to-br from-indigo-600 via-violet-600 to-indigo-700 flex items-center justify-center text-white shadow-lg shadow-indigo-600/25 ring-1 ring-white/25 transition-all duration-300 group-hover:scale-105 group-hover:-rotate-2 group-hover:shadow-indigo-600/35">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.4">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
          </svg>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-lg sm:text-xl font-extrabold tracking-tight text-slate-900">
              {{ title() }}
            </h1>
            <span class="text-[10px] font-bold uppercase tracking-widest bg-gradient-to-r from-indigo-50 to-violet-50 text-indigo-700 px-2 py-0.5 rounded-md border border-indigo-200/70">
              Studio
            </span>
          </div>
          <p class="text-[11px] sm:text-xs font-medium text-slate-500 hidden xs:block sm:block">
            Pilotage de projets &amp; synchronisation d'équipe
          </p>
        </div>
      </div>

      <!-- Sélecteur de vue (ViewToggle) & Statut temps réel -->
      <div class="flex items-center gap-3 sm:gap-4">
        <!-- Partie 17.1 : Composant partagé ViewToggle -->
        <app-view-toggle
          [currentView]="currentView()"
          (viewChange)="onViewChange($event)"
        />

        <div class="hidden md:inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-slate-900/[0.03] border border-slate-200/80">
          <span class="relative flex h-2 w-2">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
            <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
          </span>
          <span class="text-[11px] font-semibold text-slate-600 tracking-tight"> Temps réel </span>
        </div>
      </div>
    </div>
  </header>

  <!-- Contenu Principal -->
  <main class="flex-1 w-full max-w-[86rem] mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-10">
    @if (currentView() === 'tasks') {
      <app-project-list />
    } @else {
      <app-user-list />
    }
  </main>

  <!-- Pied de page minimaliste -->
  <footer class="bg-white/70 backdrop-blur-md border-t border-slate-200/70 py-6 mt-14 text-xs text-slate-500">
    <div class="max-w-[86rem] mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-3">
      <div class="flex items-center gap-2.5">
        <span class="inline-flex items-center justify-center w-5 h-5 rounded-md bg-slate-900 text-white font-bold text-[10px]">TF</span>
        <span class="font-bold text-slate-800">TaskFlow Studio</span>
        <span class="text-slate-300">&bull;</span>
        <span class="text-slate-500">Framework Web Front-End &bull; T-IINFO-GL</span>
      </div>
      <p class="font-medium text-slate-400">&copy; 2026–2027 Tous droits réservés.</p>
    </div>
  </footer>
</div>
