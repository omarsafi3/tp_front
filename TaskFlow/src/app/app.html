<div class="min-h-screen bg-slate-50 flex flex-col font-sans">
  <!-- Barre de navigation supérieure -->
  <header class="sticky top-0 z-30 bg-white border-b border-slate-200 shadow-xs">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <!-- Logo et Titre -->
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-white shadow-sm shadow-indigo-200">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
          </svg>
        </div>
        <div>
          <h1 class="text-lg font-black text-slate-900 tracking-tight flex items-center gap-2">
            {{ title() }}
            <span class="text-[10px] font-bold uppercase tracking-wider bg-indigo-50 text-indigo-700 px-2 py-0.5 rounded-full border border-indigo-200">
              Workspace
            </span>
          </h1>
          <p class="text-xs text-slate-400">Gestion et suivi de projets interactifs</p>
        </div>
      </div>

      <!-- Liens rapides / statut -->
      <div class="flex items-center gap-3">
        <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
          Connecté
        </span>
      </div>
    </div>
  </header>

  <!-- Contenu Principal -->
  <main class="flex-1">
    <app-project-list />
  </main>

  <!-- Pied de page -->
  <footer class="bg-white border-t border-slate-200 py-6 mt-12 text-center text-xs text-slate-400">
    <div class="max-w-7xl mx-auto px-4">
      <p>&copy; 2026 TaskFlow &bull; TP Architecture Frontend Angular</p>
    </div>
  </footer>
</div>
